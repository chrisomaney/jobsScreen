; Kids Jobs Signoff — Waveshare ESP32-S3-Touch-LCD-7 (800x480)
; https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-7
;
; ESP32_Display_Panel 1.x needs Arduino-ESP32 3.x (pioarduino).
; Waveshare wiki targets Arduino-ESP32 3.0.7 → platform 51.03.07.
;
; Windows: use env `ws7` for USB/COM (default). Never upload *-ota with a COM port.
;   pio run -e ws7 -t upload

[platformio]
default_envs = ws7

[env:waveshare-esp32s3-touch-lcd-7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  ; LV_CONF_INCLUDE_SIMPLE + -I include (do NOT use LV_CONF_PATH —
  ; Windows paths break the #include stringification)
  -DLV_CONF_INCLUDE_SIMPLE
  ; Relative include paths only: ${PROJECT_DIR} breaks when the project path
  ; contains spaces or Windows backslashes (e.g. C:\Users\...\My Projects).
  -Iinclude
  -I.
  ; Include path for WiFi -> Network.h; local lib/Network still links the sources
  -Ilib/Network/src
  -DESP_PANEL_BOARD_USE_SUPPORTED_FILE
  -DESP_PANEL_BOARD_INCLUDE_SUPPORTED_SIMPLE
  -DDISABLE_ALL_LIBRARY_WARNINGS

lib_deps =
  lvgl/lvgl@8.4.0
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.2.1
  h2zero/NimBLE-Arduino@1.4.3
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.3
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
  https://github.com/esp-arduino-libs/ESP32_Button.git
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3

lib_ldf_mode = deep+
lib_extra_dirs = lib
monitor_filters = esp32_exception_decoder, time
; Strip esp_ble_mesh -I dirs (Windows: #include <bits/...> → Invalid argument).
extra_scripts = scripts/scrub_windows_includes.py

; Short name for Windows MAX_PATH — same firmware, shorter .pio/build/ws7/...
[env:ws7]
extends = env:waveshare-esp32s3-touch-lcd-7

; Network upload (ArduinoOTA). Do NOT pick this for USB/COM — use ws7 first.
;   PowerShell:  $env:OTA_HOST='192.168.1.50'; $env:OTA_PASSWORD='…'
;   pio run -e ws7-ota -t upload
[env:waveshare-esp32s3-touch-lcd-7-ota]
extends = env:waveshare-esp32s3-touch-lcd-7
upload_protocol = espota
upload_port = ${sysenv.OTA_HOST}
; Hardcode panel listen port so an unset OTA_PORT never becomes --port=''.
; Override with $env:OTA_PORT only when your WAN forward uses a different external port
; (handled in scripts/ota_upload_check.py).
upload_flags =
  --port=3232
extra_scripts =
  scripts/scrub_windows_includes.py
  pre:scripts/ota_upload_check.py

[env:ws7-ota]
extends = env:waveshare-esp32s3-touch-lcd-7-ota
