; Kids Jobs Signoff — Waveshare ESP32-S3-Touch-LCD-7 (800x480)
; https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-7
;
; Env name is kept SHORT on purpose: Windows MAX_PATH (260) breaks LVGL's deep
; relative includes when the project lives under a long Downloads\...\ folder.

[platformio]
default_envs = ws7

[env:ws7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; Includes + -D defines are applied in extra_script.py (Windows-safe).
extra_scripts = pre:extra_script.py

build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17

lib_deps =
  lvgl/lvgl@8.4.0
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.2.1
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.3
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
  https://github.com/esp-arduino-libs/ESP32_Button.git
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3

lib_ldf_mode = deep+
lib_extra_dirs = lib
monitor_filters = esp32_exception_decoder, time
