; Kids Jobs Signoff — Waveshare ESP32-S3-Touch-LCD-7 (800x480)
; https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-7
;
; ESP32_Display_Panel 1.x needs Arduino-ESP32 3.x (pioarduino).
; Waveshare wiki targets Arduino-ESP32 3.0.7 → platform 51.03.07.

; Shared board/build settings (extended by named envs below).
[waveshare_esp32s3_touch_lcd_7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3 native USB-CDC: opening the serial monitor must NOT pulse DTR/RTS.
; Those lines reset the chip, the USB device disappears, and Windows shows
; "Closed serial port COMxx due to disconnection". Keep both at 0.
monitor_dtr = 0
monitor_rts = 0
; After upload the CDC COM port vanishes briefly — wait for it to return.
board_upload.wait_for_upload_port = yes
board_upload.use_1200bps_touch = no

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  ; LV_CONF_INCLUDE_SIMPLE + -I include (do NOT use LV_CONF_PATH —
  ; Windows paths break the #include stringification)
  -DLV_CONF_INCLUDE_SIMPLE
  ; Relative include paths only: ${PROJECT_DIR} breaks when the project path
  ; contains spaces or Windows backslashes (e.g. C:\Users\...\My Projects).
  -Iinclude
  -I.
  ; Include path for WiFi -> Network.h; local lib/Network still links the sources
  -Ilib/Network/src
  -DESP_PANEL_BOARD_USE_SUPPORTED_FILE
  -DESP_PANEL_BOARD_INCLUDE_SUPPORTED_SIMPLE
  -DDISABLE_ALL_LIBRARY_WARNINGS

lib_deps =
  lvgl/lvgl@8.4.0
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.2.1
  h2zero/NimBLE-Arduino@1.4.3
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.3
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
  https://github.com/esp-arduino-libs/ESP32_Button.git
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3

lib_ldf_mode = deep+
lib_extra_dirs = lib
monitor_filters = esp32_exception_decoder, time

; Full name (default / documented)
[env:waveshare-esp32s3-touch-lcd-7]
extends = waveshare_esp32s3_touch_lcd_7

; Short alias: pio run -e ws7 -t upload
[env:ws7]
extends = waveshare_esp32s3_touch_lcd_7
