# Kids panel — Home Assistant MQTT monitoring
# Paste under configuration.yaml (or a package), then reload MQTT entities /
# restart HA. Requires the Mosquitto add-on already linked to HA.
#
# Slugs: xavier, presley, jax, banx, hazel, woomba, wilma

mqtt:
  binary_sensor:
    - name: "Kids Panel Online"
      unique_id: kids_panel_online
      state_topic: "kids/panel/status"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity
      icon: mdi:tablet-dashboard

    - name: "Xavier Internet"
      unique_id: kids_xavier_internet
      state_topic: "kids/xavier/internet"
      payload_on: "on"
      payload_off: "off"
      icon: mdi:wifi
    - name: "Presley Internet"
      unique_id: kids_presley_internet
      state_topic: "kids/presley/internet"
      payload_on: "on"
      payload_off: "off"
      icon: mdi:wifi
    - name: "Jax Internet"
      unique_id: kids_jax_internet
      state_topic: "kids/jax/internet"
      payload_on: "on"
      payload_off: "off"
      icon: mdi:wifi
    - name: "Banx Internet"
      unique_id: kids_banx_internet
      state_topic: "kids/banx/internet"
      payload_on: "on"
      payload_off: "off"
      icon: mdi:wifi
    - name: "Hazel Internet"
      unique_id: kids_hazel_internet
      state_topic: "kids/hazel/internet"
      payload_on: "on"
      payload_off: "off"
      icon: mdi:wifi
    - name: "Woomba Internet"
      unique_id: kids_chris_internet
      state_topic: "kids/woomba/internet"
      payload_on: "on"
      payload_off: "off"
      icon: mdi:wifi
    - name: "Wilma Internet"
      unique_id: kids_stacy_internet
      state_topic: "kids/wilma/internet"
      payload_on: "on"
      payload_off: "off"
      icon: mdi:wifi

    - name: "Common Internet"
      unique_id: kids_common_internet
      state_topic: "kids/common/internet"
      payload_on: "on"
      payload_off: "off"
      icon: mdi:wifi-marker

  sensor:
    # —— Reward points ——
    - name: "Xavier Points"
      unique_id: kids_xavier_points
      state_topic: "kids/xavier/rewards/tally"
      unit_of_measurement: "pts"
      icon: mdi:star-circle
    - name: "Presley Points"
      unique_id: kids_presley_points
      state_topic: "kids/presley/rewards/tally"
      unit_of_measurement: "pts"
      icon: mdi:star-circle
    - name: "Jax Points"
      unique_id: kids_jax_points
      state_topic: "kids/jax/rewards/tally"
      unit_of_measurement: "pts"
      icon: mdi:star-circle
    - name: "Banx Points"
      unique_id: kids_banx_points
      state_topic: "kids/banx/rewards/tally"
      unit_of_measurement: "pts"
      icon: mdi:star-circle
    - name: "Hazel Points"
      unique_id: kids_hazel_points
      state_topic: "kids/hazel/rewards/tally"
      unit_of_measurement: "pts"
      icon: mdi:star-circle
    - name: "Woomba Points"
      unique_id: kids_chris_points
      state_topic: "kids/woomba/rewards/tally"
      unit_of_measurement: "pts"
      icon: mdi:star-circle
    - name: "Wilma Points"
      unique_id: kids_stacy_points
      state_topic: "kids/wilma/rewards/tally"
      unit_of_measurement: "pts"
      icon: mdi:star-circle

    # —— Progress % (+ attributes: done, total, required_*, override, jobs_ready) ——
    - name: "Xavier Jobs %"
      unique_id: kids_xavier_progress
      state_topic: "kids/xavier/progress"
      value_template: "{{ value_json.pct }}"
      unit_of_measurement: "%"
      json_attributes_topic: "kids/xavier/progress"
      icon: mdi:progress-check
    - name: "Presley Jobs %"
      unique_id: kids_presley_progress
      state_topic: "kids/presley/progress"
      value_template: "{{ value_json.pct }}"
      unit_of_measurement: "%"
      json_attributes_topic: "kids/presley/progress"
      icon: mdi:progress-check
    - name: "Jax Jobs %"
      unique_id: kids_jax_progress
      state_topic: "kids/jax/progress"
      value_template: "{{ value_json.pct }}"
      unit_of_measurement: "%"
      json_attributes_topic: "kids/jax/progress"
      icon: mdi:progress-check
    - name: "Banx Jobs %"
      unique_id: kids_banx_progress
      state_topic: "kids/banx/progress"
      value_template: "{{ value_json.pct }}"
      unit_of_measurement: "%"
      json_attributes_topic: "kids/banx/progress"
      icon: mdi:progress-check
    - name: "Hazel Jobs %"
      unique_id: kids_hazel_progress
      state_topic: "kids/hazel/progress"
      value_template: "{{ value_json.pct }}"
      unit_of_measurement: "%"
      json_attributes_topic: "kids/hazel/progress"
      icon: mdi:progress-check
    - name: "Woomba Jobs %"
      unique_id: kids_chris_progress
      state_topic: "kids/woomba/progress"
      value_template: "{{ value_json.pct }}"
      unit_of_measurement: "%"
      json_attributes_topic: "kids/woomba/progress"
      icon: mdi:progress-check
    - name: "Wilma Jobs %"
      unique_id: kids_stacy_progress
      state_topic: "kids/wilma/progress"
      value_template: "{{ value_json.pct }}"
      unit_of_measurement: "%"
      json_attributes_topic: "kids/wilma/progress"
      icon: mdi:progress-check

    # —— Override mode (auto / on / off) from progress JSON ——
    - name: "Xavier Internet Override"
      unique_id: kids_xavier_override
      state_topic: "kids/xavier/progress"
      value_template: "{{ value_json.override | default('auto') }}"
      icon: mdi:shield-key
    - name: "Presley Internet Override"
      unique_id: kids_presley_override
      state_topic: "kids/presley/progress"
      value_template: "{{ value_json.override | default('auto') }}"
      icon: mdi:shield-key
    - name: "Jax Internet Override"
      unique_id: kids_jax_override
      state_topic: "kids/jax/progress"
      value_template: "{{ value_json.override | default('auto') }}"
      icon: mdi:shield-key
    - name: "Banx Internet Override"
      unique_id: kids_banx_override
      state_topic: "kids/banx/progress"
      value_template: "{{ value_json.override | default('auto') }}"
      icon: mdi:shield-key
    - name: "Hazel Internet Override"
      unique_id: kids_hazel_override
      state_topic: "kids/hazel/progress"
      value_template: "{{ value_json.override | default('auto') }}"
      icon: mdi:shield-key
    - name: "Woomba Internet Override"
      unique_id: kids_chris_override
      state_topic: "kids/woomba/progress"
      value_template: "{{ value_json.override | default('auto') }}"
      icon: mdi:shield-key
    - name: "Wilma Internet Override"
      unique_id: kids_stacy_override
      state_topic: "kids/wilma/progress"
      value_template: "{{ value_json.override | default('auto') }}"
      icon: mdi:shield-key

# —— Notify when something interesting happens ——
automation:
  - id: kids_panel_offline
    alias: "Kids panel went offline"
    trigger:
      - platform: state
        entity_id: binary_sensor.kids_panel_online
        to: "off"
        for: "00:02:00"
    action:
      - service: notify.persistent_notification
        data:
          title: "Kids panel"
          message: "Panel has been offline for 2 minutes"

  - id: kids_internet_changed
    alias: "Kids — internet unlock changed"
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.xavier_internet
          - binary_sensor.presley_internet
          - binary_sensor.jax_internet
          - binary_sensor.banx_internet
          - binary_sensor.hazel_internet
          - binary_sensor.chris_internet
          - binary_sensor.stacy_internet
          - binary_sensor.common_internet
    action:
      - service: notify.persistent_notification
        data:
          title: "Kids internet"
          message: >
            {{ trigger.to_state.name }} is now
            {{ 'ON' if trigger.to_state.state == 'on' else 'OFF' }}

  - id: kids_rewards_help_event
    alias: "Kids — someone helped (leftover jobs)"
    trigger:
      - platform: mqtt
        topic: kids/rewards/event
    action:
      - service: notify.persistent_notification
        data:
          title: "Help credit"
          message: >
            {{ trigger.payload_json.doer_name }} helped with
            {{ trigger.payload_json.owner_name }}'s
            {{ trigger.payload_json.job_label }}
            (tally {{ trigger.payload_json.tally }})

  - id: kids_prize_claimed
    alias: "Kids — prize claimed"
    trigger:
      - platform: mqtt
        topic: kids/rewards/claim
    action:
      - service: notify.persistent_notification
        data:
          title: "Prize claimed"
          message: >
            {{ trigger.payload_json.kid }} claimed
            {{ trigger.payload_json.prize_name }}
            ({{ trigger.payload_json.cost }} pts → {{ trigger.payload_json.tally_after }})

  - id: kids_celebrate
    alias: "Kids — celebrate splash"
    trigger:
      - platform: mqtt
        topic: kids/rewards/celebrate
    action:
      - service: notify.persistent_notification
        data:
          title: "{{ trigger.payload_json.title | default('Celebrate') }}"
          message: >
            {{ trigger.payload_json.kid }} —
            {{ trigger.payload_json.subtitle | default(trigger.payload_json.message) }}

  # Phone push when a kid finishes required jobs and needs your Approve.
  # Swap notify.notify for your mobile app notify service.
  - id: kids_unlock_pending
    alias: "Kids — unlock needs approval"
    trigger:
      - platform: mqtt
        topic: kids/+/internet/request
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.status == 'pending' }}"
    action:
      - service: notify.notify
        data:
          title: "{{ trigger.payload_json.name }} wants internet"
          message: >
            Jobs look done ({{ trigger.payload_json.required_done }}/{{ trigger.payload_json.required_total }}).
            Open Kids Admin → Approve or Decline.
      - service: notify.persistent_notification
        data:
          title: "{{ trigger.payload_json.name }} wants internet"
          message: "Approve in Kids Admin (or MQTT kids/{{ trigger.payload_json.kid }}/internet/decision)."

